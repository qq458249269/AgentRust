name: 构建 Windows x86_64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy 检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 运行测试
        run: cargo test --all

      - name: 生成版本号
        id: version
        shell: bash
        run: |
          DATE=$(date +%Y%m%d)
          VERSION="0.${DATE}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "版本号: ${VERSION}"

      - name: 构建 Release 版本
        run: cargo build --release --bin agent

      - name: 重命名输出文件
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv target/release/agent.exe "agent-${VERSION}-windows-x86_64.exe"
          echo "构建完成: agent-${VERSION}-windows-x86_64.exe"

      - name: 计算文件哈希
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          certutil -hashfile "agent-${VERSION}-windows-x86_64.exe" SHA256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x86_64-${{ steps.version.outputs.version }}
          path: agent-*-windows-x86_64.exe
          retention-days: 30

  release:
    # 仅由 main 分支 push 触发，避免 tag push 导致的递归触发
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: agent-windows-x86_64-*

      - name: 生成版本号（Release）
        id: version
        run: echo "version=0.$(date +%Y%m%d).${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: 获取最近 10 次提交记录
        id: commits
        run: |
          git log -10 --format='- %h %s' --no-merges > commit-log.txt
          {
            echo "LOG<<EOF"
            cat commit-log.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 推送版本标签（确保 tag 存在）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$TAG"

      - name: 创建 GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## 📦 最近 10 次提交记录

            ${{ steps.commits.outputs.LOG }}
          files: artifacts/**/*.exe
          draft: false
          prerelease: true
