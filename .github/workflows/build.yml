name: 构建 Windows x86_64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy 检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 运行测试
        run: cargo test --all

      - name: 生成版本号
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            DATE=$(date +%Y%m%d)
            VERSION="0.${DATE}.${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "版本号: ${VERSION}"

      - name: 构建 Release 版本
        run: cargo build --release --bin agent

      - name: 重命名输出文件
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv target/release/agent.exe "agent-${VERSION}-windows-x86_64.exe"
          echo "构建完成: agent-${VERSION}-windows-x86_64.exe"

      - name: 计算文件哈希
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          certutil -hashfile "agent-${VERSION}-windows-x86_64.exe" SHA256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x86_64-${{ steps.version.outputs.version }}
          path: agent-*-windows-x86_64.exe
          retention-days: 30

  release:
    needs: build-windows-x86_64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: agent-windows-x86_64-*

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
